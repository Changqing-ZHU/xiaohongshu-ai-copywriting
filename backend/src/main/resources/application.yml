spring:
  application:
    name: xhs-copywriting-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always

server:
  port: 8080
  tomcat:
    # Allow Tomcat to consume a rejected near-limit request so the JSON 413 response reaches clients.
    max-swallow-size: 12MB

app:
  upload-dir: ${UPLOAD_DIR}

ai:
  provider: ${AI_PROVIDER:mock}
  qwen:
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${QWEN_API_KEY:}
    model: ${QWEN_MODEL:}

url-content:
  connect-timeout: 5s
  request-timeout: 10s
  max-image-size: 10MB
  max-redirects: 3

generation:
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    org.springframework.web.client: INFO
